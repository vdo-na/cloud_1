listen_addresses = '*'
port = 9999
socket_dir = '/var/run/postgresql'
pcp_listen_addresses = '*'
pcp_port = 9898
pcp_socket_dir = '/var/run/postgresql'
pid_file_name = '/var/run/postgresql/pgpool.pid'
logdir = '/tmp'

num_init_children = 32
max_pool = 4
child_life_time = 300
connection_life_time = 0
client_idle_limit = 0

backend_clustering_mode = 'native_replication'
load_balance_mode = on
connection_cache = on
insert_lock = on
replication_stop_on_mismatch = on
replicate_select = off
reset_query_list = 'ABORT; DISCARD ALL'

enable_pool_hba = on
allow_clear_text_frontend_auth = on
pool_passwd = ''
authentication_timeout = 60

log_destination = 'stderr'
logging_collector = off
log_min_messages = info
log_connections = on
log_statement = on
log_line_prefix = '%t: pid %p: '

backend_hostname0 = 'pg1'
backend_port0 = 5432
backend_weight0 = 1
backend_flag0 = 'ALLOW_TO_FAILOVER'

backend_hostname1 = 'pg2'
backend_port1 = 5432
backend_weight1 = 1
backend_flag1 = 'ALLOW_TO_FAILOVER'

backend_hostname2 = 'pg3'
backend_port2 = 5432
backend_weight2 = 1
backend_flag2 = 'ALLOW_TO_FAILOVER'

health_check_period = 5
health_check_timeout = 10
health_check_user = 'app'
health_check_password = 'app'
health_check_database = 'appdb'
health_check_max_retries = 3
health_check_retry_delay = 1
connect_timeout = 10000

sr_check_period = 0
sr_check_user = 'app'
sr_check_password = 'app'
sr_check_database = 'appdb'

failover_on_backend_error = on
failover_on_backend_shutdown = on
search_primary_node_timeout = 0
