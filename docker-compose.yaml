services:
  pg1:
    image: postgres:16
    container_name: pg1
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pg1_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg2:
    image: postgres:16
    container_name: pg2
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - pg2_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg3:
    image: postgres:16
    container_name: pg3
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    volumes:
      - pg3_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgpool:
    build: ./pgpool
    container_name: pgpool
    depends_on:
      pg1:
        condition: service_healthy
      pg2:
        condition: service_healthy
      pg3:
        condition: service_healthy
    ports:
      - "9999:9999"
    volumes:
      - ./pgpool/pgpool.conf:/etc/pgpool2/pgpool.conf:ro
      - ./pgpool/pool_hba.conf:/etc/pgpool2/pool_hba.conf:ro
      - ./pgpool/pcp.conf:/etc/pgpool2/pcp.conf:ro

volumes:
  pg1_data:
  pg2_data:
  pg3_data: